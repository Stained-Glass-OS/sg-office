# SG Office -- the upstream ONLYOFFICE sources our engine is built from.
# Each is pinned by tag AND commit; a build refuses a checkout whose commit
# differs. Moving to a new upstream version is changing these together, then
# rebasing patches/ and re-running the gates.
SDKJS_URL=https://github.com/ONLYOFFICE/sdkjs.git
SDKJS_TAG=v8.2.0.143
SDKJS_COMMIT=b0b9de04b953624f4650b0786afdcc7980a62bfd
CORE_URL=https://github.com/ONLYOFFICE/core.git
CORE_TAG=v8.2.0.143
CORE_COMMIT=94bb0f53065940c778817092eead7de4d487a1dc
WEBAPPS_URL=https://github.com/ONLYOFFICE/web-apps.git
WEBAPPS_TAG=v8.2.0.143
WEBAPPS_COMMIT=0b9706d47479bd5c05fab0f625aad8937aac3e51
# not tagged upstream (build_tools clones its HEAD); pinned here
HYPHEN_URL=https://github.com/hunspell/hyphen
HYPHEN_COMMIT=dcd90f0056cfbcbd2d389b7a13db45ddf5b0b98e
# build_tools: only its scripts/base.py, which upstream's third-party fetchers
# in core/Common/3dParty import (they pin the libraries' commits themselves)
BUILD_TOOLS_URL=https://github.com/ONLYOFFICE/build_tools.git
BUILD_TOOLS_TAG=v8.2.0.143
BUILD_TOOLS_COMMIT=7b9f18867a68e0a101567dd96ffba46a3dd806c5
